name: Car maintenance check

on:
  schedule:
    # 13:00 UTC every day = 9am ET / 6am PT
    - cron: "0 13 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "car/**"
      - "data/vehicles.json"
      - ".github/workflows/car-check.yml"

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install click

      - name: Run check
        id: check
        run: |
          set -e
          python -m car.check > /tmp/report.md || true
          if [ -s /tmp/report.md ]; then
            echo "has_report=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_report=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit hydrated VIN data
        if: github.event_name != 'pull_request'
        run: |
          if ! git diff --quiet -- data/vehicles.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/vehicles.json
            git commit -m "chore(car): hydrate VIN-decoded fields [skip ci]"
            git push
          fi

      - name: Open or update issue
        if: steps.check.outputs.has_report == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/report.md', 'utf8');
            const title = `Car maintenance — ${new Date().toISOString().slice(0,10)}`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'car-maintenance',
              state: 'open',
              per_page: 100,
            });
            // Reuse a single rolling issue: edit the body of the most recent open one,
            // otherwise open a new one.
            if (existing.length) {
              const issue = existing[0];
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                title,
                body,
              });
              core.notice(`Updated issue #${issue.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['car-maintenance'],
              });
              core.notice(`Opened issue #${created.number}`);
            }
